name: Atualiza dados de telemetria

on:
  schedule:
    # Roda duas vezes por dia (~07h20 e ~15h12 em horário de Brasília) pra
    # pegar o relatório diário do MOVIAS. O horário da manhã (07h20) fica
    # ~20min depois da geração do relatório no MOVIAS (07h), dando tempo do
    # e-mail chegar antes do robô checar. É seguro rodar "à toa": o script só
    # commita quando os dados extraídos são diferentes dos já publicados.
    # Os horários ficam fora da hora cheia (não 10:00/18:00 UTC) porque
    # agendamentos exatamente na hora cheia sofrem mais atraso/fila no
    # GitHub Actions.
    - cron: '20 10 * * *'
    - cron: '12 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualiza-telemetria
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Buscar relatório no e-mail e gerar dados_atuais.json
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: npm run atualizar

      - name: Commitar e publicar, se houve mudança
        run: |
          if [ -n "$(git status --porcelain dados_atuais.json)" ]; then
            git config user.name "robo-telemetria"
            git config user.email "actions@users.noreply.github.com"
            git add dados_atuais.json
            git commit -m "Atualiza dados de telemetria ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "Nada para commitar."
          fi
