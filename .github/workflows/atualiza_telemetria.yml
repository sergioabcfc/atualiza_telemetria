name: Atualiza dados de telemetria

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualiza-telemetria
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Buscar relatório no e-mail e gerar dados_atuais.json
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: npm run atualizar

      - name: Commitar e publicar, se houve mudança
        run: |
          if [ -n "$(git status --porcelain dados_atuais.json)" ]; then
            git config user.name "robo-telemetria"
            git config user.email "actions@users.noreply.github.com"
            git add dados_atuais.json
            git commit -m "Atualiza dados de telemetria ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "Nada para commitar."
          fi
